name: WMS integration validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'script.js'
      - 'index.html'
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'api/**'
      - 'vercel.json'
      - 'package*.json'
      - '.github/workflows/wms-integration-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit and regression tests
        run: npm test
      - name: Production build check
        run: npm run build
