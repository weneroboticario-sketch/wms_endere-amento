name: WMS Dourados baseline - safe validation

on:
  push:
    branches:
      - isolation/wms-dourados-safe-baseline-20261116
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-dourados-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout isolated baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit and regression tests
        run: npm test
      - name: Build
        run: npm run build
