<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Montagem — validação local</title><link rel="stylesheet" href="/style.css"><style>body{display:block;padding:20px}main{max-width:1250px;margin:auto}#transferFinalReportDetails .table-wrap{max-width:100%;overflow-x:auto}#packingAuditControls{display:grid;gap:8px;margin-bottom:16px}dialog{border:1px solid #bbcee4;border-radius:12px;padding:20px}small{color:#516781}</style><main><p>VALIDAÇÃO LOCAL — dados sintéticos, sem conexão com produção.</p><section class="panel"><h2>Montagem da caixa</h2><div class="transfer-work-grid"><div><label>Código SKU</label><input id="transferScanInput"><label>Quantidade</label><input id="transferQuantityInput" type="number"><button id="confirm">Confirmar item</button><p id="status" role="status"></p></div><div><div id="transferCurrentItem" class="current-item-card">SKU 01314 · Produto de teste</div></div></div></section><section class="panel"><h2>Resultado por SKU</h2><div id="transferFinalReportSummary" class="transfer-work-summary"></div><div id="transferFinalReportDetails"></div></section></main><script type="module">
import {createPackingController} from '/src/transfer-packing-view.js';
let rows=[{id:'i',sku:'01314',description:'Produto de teste',unit:'UN',requestedQty:4,separatedQty:4,packedQty:0,packingRevision:0}],events=[];
const transfer={id:'t',code:'SINTETICA-LOCAL',warehouseCode:'VDCG',status:'EM_LACRE',flowType:'TRANSFERENCIA_EXCEL'};
const client={from(){return{select(){return this},eq(){return this},order(){return this},async range(){return{data:events,error:null}}}},async rpc(name,r){const before=rows[0].packedQty,delta=r.p_action.operation==='LEITURA_SKU'?0:r.p_action.quantity;const revision=rows[0].packingRevision;rows[0]={...rows[0],packedQty:before+delta,packingRevision:revision+1};const e={id:r.p_action_id,item_id:'i',transfer_id:'t',audit_version:1,event_type:r.p_action.operation,quantity:delta,quantity_before:before,quantity_after:before+delta,code_method:r.p_action.code_method,quantity_method:r.p_action.operation==='LEITURA_SKU'?'SEM_QUANTIDADE':r.p_action.operation==='LEITURA_UNITARIA'?'UNITARIA':'MANUAL',user_name:'Operador sintético',created_at:new Date().toISOString(),payload:{revision_before:revision,revision_after:revision+1,code_reads:r.p_action.operation==='LEITURA_SKU'||r.p_action.operation==='LEITURA_UNITARIA'?1:0}};return{data:{event:e},error:null}}};
const c=createPackingController({client:()=>client,scope:()=> 'synthetic:VDCG:t',warehouse:()=> 'VDCG',items:()=>rows,events:()=>events,setEvents:e=>events=e,accept:r=>events.push(r.event),refresh:()=>{c.render(transfer,rows[0]);c.report(transfer)},status:text=>document.getElementById('status').textContent=text});
await c.history(transfer);c.render(transfer,rows[0]);c.report(transfer);
document.getElementById('transferScanInput').onkeydown=async e=>{if(e.key==='Enter'){const raw=e.target.value;e.target.value='';await c.locate(transfer,rows[0],raw)}};
document.getElementById('confirm').onclick=()=>c.perform(transfer,rows[0],{operation:'QUANTIDADE_MANUAL',quantity:Number(document.getElementById('transferQuantityInput').value),raw_code:'01314',code_method:c.method()});
</script></html>
